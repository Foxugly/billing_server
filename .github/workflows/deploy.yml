name: Test & Deploy

on:
  push:
    branches: [main]
  # Pas de filtre de branche cible : une PR empilée sur une autre PR doit être
  # testée elle aussi. Avec `branches: [main]`, une PR dont la base est une
  # branche de travail ne déclenche AUCUNE CI — et passe pour verte sans l'être.
  # Le job deploy reste, lui, verrouillé sur `main` par son propre `if`.
  pull_request:
  # Redéploiement manuel sans commit factice (`gh workflow run deploy.yml --ref main`).
  workflow_dispatch:

concurrency:
  # Clé sur la ref : les runs de PR ne font jamais la queue derrière un deploy de main.
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # La suite tournait sur SQLite alors que la production tourne sur
    # PostgreSQL 16 (DB_ENGINE=postgresql sur la box). SQLite est plus permissif
    # et laisse passer des requetes que PostgreSQL refuse — c'est ainsi que deux
    # endpoints casses ont vecu en production sur QuizOnline sans qu'aucun test
    # ne les voie. On teste donc sur le moteur de production.
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL n'est pas un `service` : un service se télécharge avant toute
      # étape, sans cache possible, et le registre refuse parfois (Docker Hub,
      # « Data limit exceeded » sur public.ecr.aws) — la CI échouait avant le
      # moindre test. L'image vit dans le cache d'Actions : un téléchargement par
      # mois au plus, trois tentatives, l'image du mois précédent en secours.
      - name: Clé du cache de l'image PostgreSQL (une par mois)
        id: cle-postgres
        run: echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Image PostgreSQL depuis le cache
        id: cache-postgres
        uses: actions/cache/restore@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}
          restore-keys: postgres-16-

      - name: Image PostgreSQL depuis le registre (si le cache n'a pas celle du mois)
        id: telechargement-postgres
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        run: |
          for essai in 1 2 3; do
            if docker pull public.ecr.aws/docker/library/postgres:16; then
              docker save public.ecr.aws/docker/library/postgres:16 -o /tmp/postgres-16.tar
              echo "neuve=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 20))
          done
          if [ -f /tmp/postgres-16.tar ]; then
            echo "::warning::Registre indisponible : image du cache d'un mois précédent."
          else
            echo "::error::Registre indisponible et aucune image en cache."
            exit 1
          fi

      - name: Mettre l'image du mois en cache
        if: steps.telechargement-postgres.outputs.neuve == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}

      - name: Démarrer PostgreSQL 16
        run: |
          docker load -i /tmp/postgres-16.tar
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=billing \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              echo "PostgreSQL prêt."; exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL ne répond pas."; exit 1

      - uses: actions/setup-python@v7
        with:
          # 3.12 = la version de la box (Python 3.12.3). Ne pas monter sans migrer la box.
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        env:
          STATE: TEST
          SECRET_KEY: test-secret-key
          # Convention DB_* 6 variables de la flotte (OPERATIONS.md §3.13).
          DB_ENGINE: postgresql
          DB_NAME: billing
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          STATE: TEST
          SECRET_KEY: test-secret-key
          DB_ENGINE: postgresql
          DB_NAME: billing
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write # émet le jeton OIDC pour assumer le rôle de déploiement
      contents: read

    steps:
      # OIDC -> SSM (pas de clé SSH statique). AWS-RunShellScript tourne en root :
      # il installe chaque artefact privilégié depuis le BLOB GIT COMMITÉ — jamais
      # par cp depuis l'arbre django (§3.10 / §3.11) — puis lance deploy.sh en django.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          cat > /tmp/ssm-params.json <<'EOF'
          { "commands": [
            "set -eu",
            "export HOME=/root",
            "APP=/var/www/django_websites/billing_server",
            "git config --global --get-all safe.directory 2>/dev/null | grep -qx $APP || git config --global --add safe.directory $APP",
            "sudo -u django bash -c 'umask 027; cd '$APP' && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "git -C $APP show origin/main:deploy/fetch-env-from-ssm.sh > /usr/local/sbin/billing-env-fetch.sh",
            "chown root:root /usr/local/sbin/billing-env-fetch.sh && chmod 0755 /usr/local/sbin/billing-env-fetch.sh",
            "for u in billing-env-fetch billing-gunicorn billing-celery billing-celery-beat; do git -C $APP show origin/main:deploy/systemd/$u.service > /etc/systemd/system/$u.service; done",
            "git -C $APP show origin/main:deploy/nginx/billing-api.conf > /etc/nginx/sites-available/billing-api.conf",
            "ln -sf ../sites-available/billing-api.conf /etc/nginx/sites-enabled/billing-api.conf",
            "systemctl daemon-reload",
            "systemctl enable billing-env-fetch billing-gunicorn billing-celery billing-celery-beat",
            "systemctl restart billing-env-fetch",
            "sudo -u django bash $APP/deploy/deploy.sh",
            "nginx -t && systemctl reload nginx"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy billing ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to finish
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out waiting for SSM command after 15 minutes"; exit 1
