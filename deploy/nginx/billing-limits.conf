# Rate-limit zones — `http` context.
#
# Installed by the deploy job (root, from the committed git blob, like the vhost)
# as /etc/nginx/conf.d/billing-limits.conf, BEFORE the vhost: nginx refuses an
# unknown zone (`nginx -t`). A `limit_req_zone` cannot live inside a `server`
# block, hence this separate file; the `limit_req` that use it are in
# deploy/nginx/billing-api.conf. Same model as tm-limits.conf / pushit-limits.conf.
#
# The operator account drives Stripe in LIVE mode (audit 2026-10-18, I1):
# - `billing_admin_login` guards /admin/login/, a plain Django view that the DRF
#   throttles do not cover;
# - `billing_auth_token` doubles the DRF throttle (5/min) on the console login.
# 10r/m per IP: far above human use, far below what a password-guessing run needs.
limit_req_zone $binary_remote_addr zone=billing_admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=billing_auth_token:10m rate=10r/m;
