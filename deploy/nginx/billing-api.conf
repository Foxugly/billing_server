# Foxugly Billing API — reverse proxy nginx vers gunicorn (WSGI, 127.0.0.1:8007).
# TLS via la lineage wildcard partagée `foxugly.com` — jamais de certbot par
# sous-domaine (§3.6).
#
# Installé dans /etc/nginx/sites-available/billing-api.conf, symlinké dans sites-enabled.
# Les zones `limit_req` viennent de deploy/nginx/billing-limits.conf (conf.d,
# contexte http), installé par le même job de déploiement, avant ce fichier.

server {
    listen 80;
    server_name billing-api.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    # Forme `listen ... http2` (compatible nginx < 1.25.1) — la box tourne en
    # nginx 1.24.0, où la directive moderne `http2 on;` n'existe pas encore et
    # ferait échouer `nginx -t`, donc le déploiement. Cohérent avec les autres
    # vhosts de la box.
    listen 443 ssl http2;
    server_name billing-api.foxugly.com;

    ssl_certificate     /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Pas de version de nginx dans l'en-tête Server (audit M10).
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Les webhooks Stripe (lot L2) peuvent porter des payloads volumineux.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /static/ {
        alias /var/www/django_websites/billing_server/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Le login du Django admin est une vue Django simple : les throttles DRF ne
    # s'y appliquent pas. 10 requêtes/minute par IP, petite rafale pour une faute
    # de frappe (audit 2026-10-18, I1).
    location = /admin/login/ {
        limit_req zone=billing_admin_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Login de la console : double le throttle DRF (5/min) au niveau nginx.
    location = /api/v1/auth/token/ {
        limit_req zone=billing_auth_token burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    access_log /var/log/nginx/billing-access.log;
    error_log  /var/log/nginx/billing-error.log;
}
